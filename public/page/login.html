<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LeG</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">LeG</a>
    <nav class="nav-links" aria-label="Navigatie principala">
      <a href="components.html">Componente</a>
      <a href="game.html">Joc</a>
      <a href="leaderboard.html">Clasament</a>
      <a class="nav-button" href="register.html">Cont nou</a>
    </nav>
  </header>

  <main class="auth-layout">
    <section class="auth-card">
      <p class="eyebrow">Bine ai revenit</p>
      <h1>Autentificare</h1>
      <p class="muted">Intra in cont pentru a salva scorurile si progresul pe niveluri.</p>

      <form id="loginForm" class="form-panel">
        <label for="identifier">Username sau email</label>
        <input id="identifier" type="text" name="identifier" autocomplete="username" required>

        <label for="password">Parola</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>

        <button class="button primary full" type="submit">Autentificare</button>
        <p id="authMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="small-link">Nu ai cont? <a href="register.html">Creeaza unul</a>.</p>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
