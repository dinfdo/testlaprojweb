<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inregistrare - LeG</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">LeG</a>
    <nav class="nav-links" aria-label="Navigatie principala">
      <a href="components.html">Componente</a>
      <a href="game.html">Joc</a>
      <a href="leaderboard.html">Clasament</a>
      <a class="nav-button" href="login.html">Login</a>
    </nav>
  </header>

  <main class="auth-layout">
    <section class="auth-card">
      <p class="eyebrow">Start rapid</p>
      <h1>Creare cont</h1>
      <p class="muted">Contul iti leaga raspunsurile de progres, scoruri si componente invatate.</p>

      <form id="registerForm" class="form-panel">
        <label for="name">Nume utilizator</label>
        <input id="name" type="text" name="name" autocomplete="username" required>

        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" required>

        <label for="newPassword">Parola</label>
        <input id="newPassword" type="password" name="password" autocomplete="new-password" minlength="6" required>

        <button class="button primary full" type="submit">Creeaza cont</button>
        <p id="authMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="small-link">Ai deja cont? <a href="login.html">Autentifica-te</a>.</p>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
