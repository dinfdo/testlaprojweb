<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LeG</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">LeG</a>
  </header>

  <main>
    <section class="page-heading">
      <p class="eyebrow">Progres personal</p>
      <h1>Dashboard</h1>
      <p class="muted">Urmareste nivelurile, scorurile maxime si componentele pe care le-ai invatat.</p>
    </section>

    <section class="stats-row" aria-label="Rezumat progres">
      <article class="stat-card">
        <span class="stat-value" id="completedLevels">0</span>
        <span class="stat-label">niveluri completate</span>
      </article>
      <article class="stat-card">
        <span class="stat-value" id="learnedComponents">0</span>
        <span class="stat-label">componente invatate</span>
      </article>
      <article class="stat-card">
        <span class="stat-value" id="bestAverage">0%</span>
        <span class="stat-label">medie scoruri</span>
      </article>
    </section>

    <section class="content-grid">
      <div class="panel">
        <div class="section-title">
          <h2>Niveluri</h2>
          <a class="text-link" href="game.html">Joaca</a>
        </div>
        <div id="progressLevels" class="list-stack"></div>
      </div>
      <div class="panel">
        <div class="section-title">
          <h2>Incercari recente</h2>
        </div>
        <div id="recentSessions" class="list-stack"></div>
      </div>
    </section>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/dashboard.js"></script>
</body>
</html>
